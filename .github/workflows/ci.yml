name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies rot without anyone touching the code, so the audit also runs
  # on a schedule rather than only when something is pushed.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest

    # No services and no env: the catalog is static, so nothing in the build
    # or the tests touches a database.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the job on critical findings only. Highs are reported but do not
      # block, because the current ones sit in Next's own transitive tree and
      # can only be cleared by a major upgrade — see HANDOFF.md. Revisit this
      # threshold once that upgrade lands.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Report all advisories
        if: always()
        run: npm audit || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A committed API key is what started this workstream. Cheap to check,
      # expensive to miss.
      - name: Scan for committed API keys
        run: |
          if grep -rEn 'AIza[0-9A-Za-z_-]{30,}' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::A Google API key appears to be committed."
            exit 1
          fi
          echo "No Google API keys found in the working tree."
